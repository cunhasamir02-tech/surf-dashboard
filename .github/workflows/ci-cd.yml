name: CI/CD - Surf Dashboard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"

env:
  IMAGE_NAME: ghcr.io/cunhasamir02-tech/surf-dashboard/surf-app

jobs:
  test:
    name: Testes e lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: app
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        working-directory: app
        run: flake8 . --max-line-length=100 --extend-ignore=E501,W503 --exit-zero

      - name: Checagem de sintaxe
        working-directory: app
        run: python -m py_compile app.py surf_client.py

  build-and-push:
    name: Build + push da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy (Render)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Disparar deploy hook do Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Health check pós-deploy
        run: |
          sleep 45
          curl -fsS "${{ secrets.APP_HEALTHCHECK_URL }}/healthz"
